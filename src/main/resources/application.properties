spring.application.name=iriro-server
spring.config.import=optional:file:./.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${PORT}
management.endpoints.web.exposure.include=health,info

integrations.ai.base-url=${AI_SERVER_URL}

kma.weather.url=${API_URL}
kma.weather.service-key=${API_KEY}

iriro.auth.jwt-secret=${AUTH_JWT_SECRET}
iriro.auth.access-token-ttl-seconds=${AUTH_ACCESS_TOKEN_TTL_SECONDS}
iriro.auth.refresh-token-ttl-seconds=${AUTH_REFRESH_TOKEN_TTL_SECONDS}
iriro.auth.kakao.app-id=${KAKAO_APP_ID}
auth.kakao.base-url=https://kapi.kakao.com
auth.naver.base-url=https://openapi.naver.com

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
