spring:
  application:
    name: iriro-server
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/iriro}
    username: ${DB_USERNAME:iriro}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

kma:
  weather:
    url: ${API_URL}
    service-key: ${API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info

integrations:
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8000}

iriro:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
