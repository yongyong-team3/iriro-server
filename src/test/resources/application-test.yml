spring:
  datasource:
    url: jdbc:h2:mem:iriro;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
